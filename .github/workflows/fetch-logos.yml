name: fetch-logos
on:
  push:
    paths: ['.github/workflows/fetch-logos.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download logos
        run: |
          mkdir -p logos
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          dl(){ curl -fsSL -A "$UA" -o "logos/$1" "$2" || echo "FAILED $1"; }
          dl air-canada.svg "https://upload.wikimedia.org/wikipedia/commons/2/24/Air_Canada_2017.svg"
          dl radnet.jpg "https://upload.wikimedia.org/wikipedia/en/1/11/Logo_%28RadNet%29.jpg"
          ls -la logos
      - name: Commit
        run: |
          git config user.name "logo-bot"
          git config user.email "logo-bot@users.noreply.github.com"
          git add logos
          git commit -m "Add client logo files" || echo "nothing to commit"
          git push
