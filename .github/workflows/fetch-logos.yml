name: fetch-logos
on:
  push:
    paths: ['.github/workflows/fetch-logos.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download logos
        run: |
          mkdir -p logos
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          dl(){ curl -fsSL -A "$UA" -o "logos/$1" "$2" || echo "FAILED $1"; }
          dl boeing.png "https://upload.wikimedia.org/wikipedia/commons/thumb/4/4f/Boeing_full_logo.svg/500px-Boeing_full_logo.svg.png"
          dl pratt-whitney.png "https://upload.wikimedia.org/wikipedia/commons/thumb/f/f2/Pratt_%26_Whitney_logo2023.svg/500px-Pratt_%26_Whitney_logo2023.svg.png"
          dl united.png "https://upload.wikimedia.org/wikipedia/en/thumb/e/e0/United_Airlines_Logo.svg/500px-United_Airlines_Logo.svg.png"
          dl air-canada.png "https://upload.wikimedia.org/wikipedia/commons/thumb/2/24/Air_Canada_2017.svg/500px-Air_Canada_2017.svg.png"
          dl genie.png "https://upload.wikimedia.org/wikipedia/commons/f/f4/PrimaryGenieLogo_RGB.png"
          dl radnet.jpg "https://upload.wikimedia.org/wikipedia/en/thumb/1/11/Logo_%28RadNet%29.jpg/250px-Logo_%28RadNet%29.jpg"
          dl moore.png "https://www.miinet.com/images/Moore-Industries-Worldwide.png"
          dl uvdi.png "https://www.uvdi.com/wp-content/uploads/2023/05/uvdi-logo-2026.png"
          dl lisi.svg "https://www.lisi-aerospace.com/wp-content/themes/lisi2018/images/logo_color.svg"
          ls -la logos
      - name: Commit
        run: |
          git config user.name "logo-bot"
          git config user.email "logo-bot@users.noreply.github.com"
          git add logos
          git commit -m "Add client logo files" || echo "nothing to commit"
          git push
